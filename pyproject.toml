[project]
name = "webflyx"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
